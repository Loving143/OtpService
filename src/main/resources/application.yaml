spring:
  application:
    name: otp-service

server:
  port: 8042

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: 192.168.18.163  # Remove ${} for static IP
    instance-id: otp-service:8042  # Use proper placeholders

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
